name: tool-using-agent
runtime: python3.12
entrypoint: python main.py

# Tool-using clinical-workflow agent. Invokes external tools via
# MCP (Model Context Protocol) to perform allowed operations:
# lab-result-fetch, billing-code-lookup, ICD-10-translate,
# scheduling-window-query, etc. Operates on PHI (member ID,
# encounter context, patient identifiers in tool-call arguments).
data_classification: PHI

# Pinned per-host TLS certificates. Production customers replace
# these with the LLM provider's published trust roots and the
# customer's MCP server trust roots.
# tls_pinned_certs:
#   - host: api.anthropic.com
#     sha256_fingerprint: <sha256 of provider's cert>
#   - host: mcp.example.com
#     sha256_fingerprint: <sha256 of customer's MCP server cert>

# Egress allowlist:
#   api.anthropic.com    — LLM agent reasoning + tool-use loop
#   *.mcp.example.com    — placeholder for the customer's MCP server.
#                            Customer substitutes their actual host
#                            (typically internal: mcp.customer.internal,
#                            or hosted: e.g. an Anthropic-published
#                            MCP server endpoint).
egress_declaration:
  - api.anthropic.com
  - mcp.example.com   # customer substitutes their MCP server host

# MCP tool whitelist + blocklist. Whitelist takes precedence when
# both are set. The sealed daemon parses outbound JSON-RPC
# `tools/call` envelopes and rejects calls whose tool_name is not
# whitelisted, with the `mcp_tool_not_allowed` ActivityEvent
# recorded. Calls to `prohibited_tools` produce explicit denial
# events with the prohibited-tool reason code.
#
# Reference workflow whitelist below covers the common
# read-mostly clinical-workflow operations. Customer extends per
# their tool-server's published catalog.
mcp_policy:
  allowed_tools:
    # Read-only retrieval
    - lab_result_fetch
    - encounter_history_query
    - medication_list_fetch
    - allergy_list_fetch
    - billing_code_lookup
    - icd10_translate
    - cpt_lookup
    # Read-only scheduling
    - scheduling_window_query
    - provider_directory_lookup
  prohibited_tools:
    # Write operations explicitly blocked at infrastructure layer
    - schedule_appointment_write
    - send_secure_message
    - delete_record
    - admin_console_access
    - impersonate_user
    - export_member_directory

# Per-Capsulefile signing config — optional BYO-HSM customer
# attestation. When configured, each McpToolInvoked + McpToolDenied
# event is fire-and-buffered to the customer's signing endpoint
# over mTLS; signatures absorbed at capsule destroy and bound into
# the AuditProof's per_event_attestations reserved slot. Per-tool-
# call non-repudiation under the customer's signing authority.
#
# Concrete shape (uncomment + populate for production):
# signing_config:
#   endpoint: https://signer.customer-internal.example.com/v1/sign
#   client_cert_secret: nanorix_signer_client_cert
#   client_key_secret: nanorix_signer_client_key
#   server_ca_pin: sha256:<hex>
#   public_key_id: customer-prod-2026-q2

packages:
  python:
    - anthropic==0.39.0
    - httpx==0.27.2
    - pydantic==2.9.2

# Multi-runtime declaration. Some MCP server SDKs / tool stubs
# customers ship are TypeScript-only (e.g., the Anthropic-published
# MCP server templates are predominantly Node.js). Declaring
# Node 22 alongside Python lets customers compose Python agent
# code + Node tool stubs in the same capsule.
#
# Uncomment to add Node packages:
# packages:
#   node:
#     - "@modelcontextprotocol/sdk@^0.5.0"

files:
  - main.py

# Tool-using agent loops are typically shorter than reasoning-only
# loops — a tool call resolves a question that would otherwise
# require multiple LLM iterations. 30min capsule cap is sufficient
# for most workflows; extend to 60min for complex multi-tool flows.
default_ttl: 1800
memory_mb: 2048

env:
  ANTHROPIC_MODEL: claude-3-5-sonnet-latest
  # Customer's MCP server endpoint. Empty default forces the
  # pipeline into stub mode. Production deployments MUST set this
  # to the customer's MCP server (mTLS-attested).
  MCP_SERVER_URI: ""
  # Loop control
  MAX_AGENT_ITERATIONS: "10"
